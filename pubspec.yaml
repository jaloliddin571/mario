name: mario
description: "Mario Taxi Application"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # Localization
  easy_localization: ^3.0.7
  intl: ^0.20.2

  # State Management
  provider: ^6.1.2

  # Local Storage
  shared_preferences: ^2.3.2

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Excel / Files
  syncfusion_flutter_xlsio: ^33.2.7
  path_provider: ^2.1.4
  open_file: ^3.3.2
  permission_handler: ^11.3.1

  # UI
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/translations/